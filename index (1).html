<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FizHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=STIX+Two+Text:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --soft:#ECEEF2; --ink:#14161B; --muted:#6A7080; --faint:#9BA1AE;
  --line:#E2E5EA; --accent:#2F43C8; --on-accent:#FFFFFF; --accent-tint:rgba(47,67,200,.07);
  --ok:#1C7A50; --bad:#C23B33; --ok-tint:rgba(28,122,80,.06); --bad-tint:rgba(194,59,51,.06);
  --nav:rgba(245,246,248,.82);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171C; --surface:#1D2026; --soft:#262A31; --ink:#ECEEF2; --muted:#9AA0AD; --faint:#6E7480;
    --line:#2C3038; --accent:#93A4FF; --on-accent:#121524; --accent-tint:rgba(147,164,255,.1);
    --ok:#6FD0A0; --bad:#FF8C83; --ok-tint:rgba(111,208,160,.08); --bad-tint:rgba(255,140,131,.08);
    --nav:rgba(21,23,28,.82);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171C; --surface:#1D2026; --soft:#262A31; --ink:#ECEEF2; --muted:#9AA0AD; --faint:#6E7480;
  --line:#2C3038; --accent:#93A4FF; --on-accent:#121524; --accent-tint:rgba(147,164,255,.1);
  --ok:#6FD0A0; --bad:#FF8C83; --ok-tint:rgba(111,208,160,.08); --bad-tint:rgba(255,140,131,.08);
  --nav:rgba(21,23,28,.82);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;color:var(--ink);background:var(--bg);font-family:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.app{max-width:520px;margin:0 auto;padding:28px 22px 120px;min-height:100vh}

/* формулы */
.fx{font-family:'STIX Two Text','Cambria Math','Times New Roman',serif;font-style:italic;font-weight:400;white-space:nowrap}
.fx sub,.fx sup{font-size:.6em;font-style:normal}
.fx .n{font-style:normal}
.fx .eq,.fx .op{font-style:normal;margin:0 .24em;color:var(--muted)}
.fx .dot{font-style:normal;margin:0 .06em;color:var(--muted)}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.88em;margin:0 .08em}
.frac>span{padding:0 .22em;line-height:1.28}
.frac>span:first-child{border-bottom:1.2px solid currentColor}
.rt{display:inline-flex;align-items:stretch;vertical-align:middle}
.rt .rs{font-style:normal;font-size:1.12em;line-height:1}
.rt .rad{border-top:1.2px solid currentColor;padding:.1em .12em 0;display:inline-flex;align-items:center}
.big{font-size:2.2rem;line-height:1.3}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px 24px;margin:18px 0;overflow-x:auto}

/* главная */
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:44px}
.logo{font-family:'Golos Text',system-ui,sans-serif;font-style:normal;font-weight:600;font-size:1.3rem;line-height:1;margin:0;letter-spacing:-.02em}
.streak{color:var(--muted);font-size:.88rem}
.hero{margin:0 0 30px}
.hero .fx{font-size:3.6rem;line-height:1.15;letter-spacing:-.01em}
.hero p{margin:18px 0 0;font-size:1.15rem;line-height:1.45;max-width:22em}
.lead{margin:0 0 28px;color:var(--muted);font-size:.95rem;max-width:32em}
.title{font-size:1.7rem;font-weight:600;letter-spacing:-.02em;margin:0 0 6px;line-height:1.2}
.status{margin:0 0 14px;color:var(--muted);font-size:.92rem}
h2{font-size:.9rem;font-weight:500;color:var(--muted);margin:44px 0 6px}
.hint{color:var(--faint);font-size:.86rem;margin:10px 0 0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 18px;font-weight:500;min-height:52px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.pick{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin-top:10px;transition:border-color .15s}
.pick:hover{border-color:var(--faint)}
.pick .pl{display:block;color:var(--faint);font-size:.8rem}
.pick .pv{display:block;font-weight:500;margin-top:1px}
.pick .pd{display:block;color:var(--muted);font-size:.86rem;margin-top:2px}
.chev{flex:none;color:var(--faint)}
.pop-bg{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,10,14,.42)}
.pop-bg.anim{animation:popfade .2s ease}
.pop-bg.anim .pop{animation:popup .26s cubic-bezier(.2,.8,.2,1)}
.pop{width:100%;max-width:520px;max-height:82vh;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 22px calc(18px + env(safe-area-inset-bottom,0px))}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
.pop h3{font-size:1.1rem;font-weight:600;margin:0}
.pop .psub{color:var(--muted);font-size:.88rem;margin:2px 0 8px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0}
.row:last-of-type{border-bottom:0}
.row .ot{display:block;font-weight:500}
.row .od{display:block;color:var(--muted);font-size:.86rem;margin-top:1px}
.row .rc{margin-left:auto;color:var(--faint);font-size:.84rem;white-space:nowrap}
.mark{flex:none;width:22px;height:22px;border:1.5px solid var(--faint);border-radius:7px;display:grid;place-items:center;color:var(--on-accent)}
.mark.radio{border-radius:50%}
.mark svg{opacity:0}
.row.on .mark{background:var(--accent);border-color:var(--accent)}
.row.on .mark svg{opacity:1}
.row.all{border-bottom:1px solid var(--line)}
.pop .btn{margin-top:14px}
@keyframes popfade{from{opacity:0}}
@keyframes popup{from{transform:translateY(40px);opacity:.4}}
@media (min-width:640px){.pop-bg{align-items:center}.pop{border-radius:22px;padding-bottom:22px}.grab{display:none}}
.back{margin:-8px 0 10px}
.ask{color:var(--muted);font-size:.92rem;margin:4px 0 0}
.big-n{font-weight:600;white-space:nowrap}
.bosstag{display:flex;align-items:center;gap:6px;color:var(--accent);font-size:.86rem;font-weight:500;margin:0 0 8px}
.steps{margin:6px 0 0;padding-left:1.2em}
.steps li{margin:6px 0;padding-left:2px}
.cupline{display:flex;align-items:center;gap:8px;color:var(--accent);font-weight:600}
.cupbig{display:flex;align-items:center;gap:14px;background:var(--accent-tint);border-radius:16px;padding:16px 18px;margin:18px 0 0;color:var(--accent)}
.cupbig svg{width:40px;height:40px;flex:none}
.cupbig p{margin:0;color:var(--ink)}
.bosses{border-top:1px solid var(--line);margin-top:14px}
.boss{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:15px 0}
.boss .pl{display:block;color:var(--faint);font-size:.8rem}
.boss .pv{display:block;font-weight:500}
.boss:hover .pv{color:var(--accent)}
.bst{display:inline-flex;align-items:center;gap:5px;font-size:.82rem;color:var(--muted);white-space:nowrap}
.bst.new{color:var(--faint)}
.bst.cup{color:var(--accent);font-weight:500}
.bst svg{width:16px;height:16px}
.tdet{border-bottom:1px solid var(--line)}
.tdet summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;cursor:pointer;list-style:none}
.tdet summary::-webkit-details-marker{display:none}
.tdet .pl{display:block;color:var(--faint);font-size:.8rem}
.tdet .pv{display:block;font-weight:500}
.tside{display:flex;align-items:center;gap:6px;flex:none}
.dchev{color:var(--faint);transition:transform .2s}
.tdet[open] .dchev{transform:rotate(180deg)}
.tbody{padding:0 0 16px}
.tbody h3{font-size:.84rem;font-weight:500;color:var(--muted);margin:16px 0 4px}
.tbody .fx{font-size:1.3rem}
.bst.ok{color:var(--ok)}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px}
.empty p{margin:0 0 8px}
.empty .btn{margin-top:8px}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;margin:4px 0 6px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 16px;font-size:.92rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.utab{width:100%;border-collapse:collapse;margin-top:10px;font-size:.9rem}
.utab th{text-align:left;font-weight:500;color:var(--faint);font-size:.8rem;padding:0 8px 6px 0;border-bottom:1px solid var(--line)}
.utab td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.utab td:last-child{color:var(--muted)}
.conv{list-style:none;margin:6px 0 0;padding:0}
.conv li{padding:6px 0}
.conv .ceq{display:block;font-weight:500}
.conv .about{margin:2px 0 0}
.ref .fitem .fname{font-weight:500}
.tabnote{color:var(--muted);font-size:.9rem;margin:12px 0 0;min-height:2.9em}
.home h2{margin-top:30px}
.start{margin-top:32px}
.modes{border-top:1px solid var(--line)}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:18px 0}
.mode:hover .mname{color:var(--accent)}
.mname{font-weight:500;font-size:1.02rem;transition:color .15s}
.mdesc{color:var(--muted);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid transparent;background:var(--soft);border-radius:999px;padding:8px 15px;font-size:.9rem;color:var(--muted);transition:background .15s,color .15s}
.chip.on{background:var(--ink);color:var(--bg)}
.link{background:none;border:0;padding:8px 0;color:var(--muted);font-size:.9rem}
.link:hover{color:var(--ink)}
.reset{margin-top:36px}
.reset .link{color:var(--faint)}

/* вопрос */
.qtop{display:flex;justify-content:space-between;align-items:center}
.count{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
.bar{height:2px;background:var(--line);border-radius:2px;overflow:hidden;margin:10px 0 34px}
.bar span{display:block;height:100%;background:var(--ink);transition:width .4s ease}
.modename{color:var(--faint);font-size:.86rem;margin:0 0 8px}
.qtext{font-size:1.18rem;line-height:1.5;margin:0 0 8px;letter-spacing:-.005em}
.fname{font-weight:600}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:15px 18px;min-height:54px;transition:border-color .15s}
.opt:hover:not(:disabled){border-color:var(--faint)}
.opt.right{border-color:var(--ok);background:var(--ok-tint)}
.opt.wrong{border-color:var(--bad);background:var(--bad-tint)}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong){opacity:.55}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ph{font-family:'Golos Text',system-ui,sans-serif;font-style:normal;font-size:.95rem;color:var(--faint)}
.build .fx{white-space:normal}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;margin-top:10px}
.key{min-height:52px;border:0;background:var(--soft);border-radius:12px;font-size:1.25rem;padding:4px;transition:background .12s}
.key:active{background:var(--line)}
.key.v{background:var(--surface);border:1px solid var(--line);font-family:'STIX Two Text','Times New Roman',serif;font-style:italic}
.key.v sub{font-size:.6em;font-style:normal}
.palabel{color:var(--faint);font-size:.84rem;margin:20px 0 0}
.acts{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:22px}
.fb{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 18px;margin:22px 0 0}
.fb .fbt{display:flex;align-items:center;gap:8px}
.fb .fbt::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.fb.bad .fbt::before,.fb.note .fbt::before{background:var(--bad)}
.fb.note{background:transparent}
.fbt{font-weight:600;margin:0 0 4px}
.fbx p{margin:8px 0;color:var(--ink)}
.fbx .fx{font-size:1.35rem}
.fb.final .fbt::before{background:var(--accent)}
.fbx h3{font-size:.84rem;font-weight:500;color:var(--muted);margin:18px 0 4px}
.fbx h3:first-child{margin-top:8px}
.fbx .small{color:var(--muted);font-size:.88rem}
.forms{list-style:none;margin:8px 0 0;padding:0}
.forms li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.forms li .fx{font-size:1.2rem}
.forms li>span:last-child{color:var(--muted);font-size:.84rem;text-align:right}
.about{color:var(--muted);font-size:.9rem;margin:6px 0 0}
.fbrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.next{margin-top:18px}

/* итог */
.endscore{font-family:'STIX Two Text','Times New Roman',serif;font-style:italic;font-size:4rem;line-height:1;margin:0 0 12px;letter-spacing:-.02em}
.endlist{padding:0;margin:8px 0 0;list-style:none;border-top:1px solid var(--line)}
.endlist li{padding:12px 0;border-bottom:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:32px}

/* справочник */
.ref h2{margin-top:40px}
.fitem{padding:18px 0;border-bottom:1px solid var(--line)}
.fitem:first-of-type{border-top:1px solid var(--line)}
.fhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.fhead .fname{font-weight:500}
.fstate{font-size:.78rem;color:var(--faint);white-space:nowrap}
.fstate.learned{color:var(--ok)}
.fstate.due{color:var(--bad)}
.fitem>.fx{font-size:1.6rem;display:inline-block;margin:10px 0 6px}
.legend{margin:2px 0 0;padding:0;list-style:none;color:var(--muted);font-size:.88rem}
.legend li{padding:1px 0}
.legend .fx{font-size:1.02rem;color:var(--ink);margin:0}

/* навигация */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;background:var(--nav);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{flex:0 1 200px;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;border-radius:12px;padding:6px 10px 4px;font-weight:500;font-size:.78rem;color:var(--faint);transition:color .15s}
.nav button svg{display:block}
.nav button.on{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;max-width:90vw;z-index:10;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){.big{font-size:1.85rem}.hero .fx{font-size:3rem}.app{padding-left:18px;padding-right:18px}}
</style>
</head>
<body>
<main class="app" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
'use strict';
/* ===== Telegram Mini App ===== */
const tg=(window.Telegram&&window.Telegram.WebApp)||null;
const inTG=!!(tg&&tg.initData);
const tgAtLeast=v=>inTG&&typeof tg.isVersionAtLeast==='function'&&tg.isVersionAtLeast(v);
function haptic(kind){if(!tgAtLeast('6.1'))return;try{if(kind==='ok'||kind==='bad')tg.HapticFeedback.notificationOccurred(kind==='ok'?'success':'error');else tg.HapticFeedback.impactOccurred('light');}catch(e){}}
function applyTgTheme(){
  if(!inTG)return;
  document.documentElement.setAttribute('data-theme',tg.colorScheme==='dark'?'dark':'light');
  const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  if(tgAtLeast('6.9')){try{tg.setHeaderColor(bg);tg.setBackgroundColor(bg);}catch(e){}}
}
if(inTG){
  tg.ready();tg.expand();
  if(tgAtLeast('7.7')){try{tg.disableVerticalSwipes();}catch(e){}}
  applyTgTheme();
  tg.onEvent('themeChanged',applyTgTheme);
}

/* ===== Учебный контент ===== */
const D=(m=0,kg=0,s=0,A=0,K=0)=>[m,kg,s,A,K];
const Q={
  m:{s:'m',n:'масса',u:'кг',d:D(0,1)},
  m1:{s:'m<sub>1</sub>',n:'масса первого тела',u:'кг',d:D(0,1)},
  m2:{s:'m<sub>2</sub>',n:'масса второго тела',u:'кг',d:D(0,1)},
  v:{s:'v',n:'скорость',u:'м/с',d:D(1,0,-1)},
  a:{s:'a',n:'ускорение',u:'м/с²',d:D(1,0,-2)},
  F:{s:'F',n:'сила',u:'Н',d:D(1,1,-2)},
  t:{s:'t',n:'время',u:'с',d:D(0,0,1)},
  s:{s:'s',n:'путь',u:'м',d:D(1)},
  h:{s:'h',n:'высота',u:'м',d:D(1)},
  x:{s:'x',n:'удлинение пружины',u:'м',d:D(1)},
  r:{s:'r',n:'расстояние между телами',u:'м',d:D(1)},
  Ek:{s:'E<sub>к</sub>',n:'кинетическая энергия',u:'Дж',d:D(2,1,-2)},
  Ep:{s:'E<sub>п</sub>',n:'потенциальная энергия',u:'Дж',d:D(2,1,-2)},
  A:{s:'A',n:'работа',u:'Дж',d:D(2,1,-2)},
  N:{s:'N',n:'мощность',u:'Вт',d:D(2,1,-3)},
  p:{s:'p',n:'импульс',u:'кг·м/с',d:D(1,1,-1)},
  pr:{s:'p',n:'давление',u:'Па',d:D(-1,1,-2)},
  S:{s:'S',n:'площадь',u:'м²',d:D(2)},
  rho:{s:'ρ',n:'плотность',u:'кг/м³',d:D(-3,1)},
  V:{s:'V',n:'объём',u:'м³',d:D(3)},
  k:{s:'k',n:'жёсткость пружины',u:'Н/м',d:D(0,1,-2)},
  g:{s:'g',n:'ускорение свободного падения',u:'м/с²',d:D(1,0,-2)},
  G:{s:'G',n:'гравитационная постоянная',u:'Н·м²/кг²',d:D(3,-1,-2)},
  I:{s:'I',n:'сила тока',u:'А',d:D(0,0,0,1)},
  U:{s:'U',n:'напряжение',u:'В',d:D(2,1,-3,-1)},
  R:{s:'R',n:'сопротивление',u:'Ом',d:D(2,1,-3,-2)},
  q:{s:'q',n:'заряд',u:'Кл',d:D(0,0,1,1)},
  Q:{s:'Q',n:'количество теплоты',u:'Дж',d:D(2,1,-2)},
  c:{s:'c',n:'удельная теплоёмкость',u:'Дж/(кг·°C)',d:D(2,0,-2,0,-1)},

const ABOUT={"speed": {"about": "Показывает, какой путь тело проходит за единицу времени, если движется с постоянной скоростью.", "use": "Скорость, путь или время в задачах на равномерное движение: поезд, пешеход, автомобиль."}, "accel": {"about": "Ускорение показывает, на сколько меняется скорость за каждую секунду. Из конечной скорости вычитают начальную и делят на время, за которое скорость изменилась.", "use": "Ускорение при разгоне или торможении, скорость в любой момент времени, время разгона."}, "disp": {"about": "Перемещение складывается из двух частей: v₀·t — путь, который тело прошло бы с начальной скоростью, и a·t²/2 — добавка за счёт ускорения.", "use": "Путь при разгоне или торможении, начальную скорость, ускорение по известному пути."}, "freefall": {"about": "Тело, отпущенное без начальной скорости, падает с ускорением g. Высота растёт пропорционально квадрату времени: за вдвое большее время тело пролетает в 4 раза больше.", "use": "Высоту падения по времени и время падения с известной высоты."}, "newton2": {"about": "Сила сообщает телу ускорение. Чем больше сила, тем больше ускорение; чем больше масса, тем труднее изменить скорость тела.", "use": "Силу, массу или ускорение тела. Это основа почти всех задач динамики."}, "weight": {"about": "Земля притягивает каждое тело с силой, пропорциональной его массе. У поверхности Земли g ≈ 9,8 м/с² одинаково для всех тел.", "use": "Силу тяжести по массе или массу по силе тяжести."}, "hooke": {"about": "Сила упругости пропорциональна удлинению пружины: растянешь вдвое сильнее — пружина потянет обратно вдвое сильнее. Жёсткость k показывает, насколько тугая пружина.", "use": "Силу упругости, жёсткость пружины, удлинение под нагрузкой."}, "grav": {"about": "Любые два тела притягиваются. Сила растёт с массами и быстро убывает с расстоянием: если расстояние увеличить вдвое, сила станет в 4 раза меньше.", "use": "Силу притяжения планет и спутников, массу планеты, расстояние между телами."}, "momentum": {"about": "Импульс — это «количество движения»: чем тяжелее тело и чем быстрее оно движется, тем труднее его остановить. Направлен так же, как скорость.", "use": "Импульс тела, а вместе с законом сохранения импульса — скорости тел после столкновения или выстрела."}, "ek": {"about": "Энергия движущегося тела. Она зависит от квадрата скорости: при удвоении скорости энергия растёт в 4 раза. Поэтому так опасна высокая скорость на дороге.", "use": "Энергию тела, его скорость или массу, а вместе с законом сохранения энергии — скорость в конце падения."}, "ep": {"about": "Энергия тела, поднятого над землёй. Чем выше и тяжелее тело, тем больше работы совершит сила тяжести, пока оно падает.", "use": "Энергию поднятого тела, высоту и массу, а вместе с кинетической энергией — скорость при падении."}, "work": {"about": "Работа совершается, когда сила перемещает тело. Эта формула верна, если сила направлена вдоль перемещения.", "use": "Работу силы, силу по известной работе, пройденный путь."}, "power": {"about": "Мощность показывает, как быстро совершается работа: та же работа за меньшее время означает большую мощность.", "use": "Мощность двигателя или человека, работу за известное время, время выполнения работы."}, "density": {"about": "Плотность показывает, какая масса приходится на единицу объёма. У каждого вещества своя плотность, поэтому по ней можно узнать вещество.", "use": "Массу тела по объёму, объём по массе, вещество по плотности."}, "pressure": {"about": "Давление — это сила, приходящаяся на единицу площади. Та же сила на меньшую площадь даёт большее давление: поэтому нож режет, а на широких лыжах не проваливаешься в снег.", "use": "Давление тела на опору, силу давления, нужную площадь опоры."}, "hydrop": {"about": "Жидкость давит тем сильнее, чем глубже и чем она плотнее. От формы сосуда давление не зависит.", "use": "Давление на глубине, глубину по давлению, плотность жидкости."}, "archimedes": {"about": "Жидкость выталкивает погружённое тело с силой, равной весу вытесненной жидко function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}

}

/* ===== Алгебра формул ===== */
function solve(f,t){
  const coef=f.c||[1,1];
  if(t===f.lhs)return {inner:Object.assign({},f.e),ic:coef.slice(),root:1};
  const et=f.e[t],s=Math.sign(et),mm=Math.abs(et);
  const inner={};inner[f.lhs]=s;
  for(const v in f.e)if(v!==t)inner[v]=-s*f.e[v];
  return {inner,ic:s>0?[coef[1],coef[0]]:[coef[0],coef[1]],root:mm};
}
function exps(sol){const o={};for(const v in sol.inner)o[v]=sol.inner[v]/sol.root;return o;}
function trueVal(sol,env){let r=Math.pow(sol.ic[0]/sol.ic[1],1/sol.root);const e=exps(sol);for(const v in e)r*=Math.pow(env[v],e[v]);return r;}
function qHTMLsym(id,e){let s=Q[id].s;if(Math.abs(e)===2)s+='<sup>2</sup>';return s;}
function solHTML(sol){
  const num=[],den=[];
  if(sol.ic[0]!==1)num.push(`<span class="n">${sol.ic[0]}</span>`);
  if(sol.ic[1]!==1)den.push(`<span class="n">${sol.ic[1]}</span>`);
  for(const v in sol.inner){const e=sol.inner[v];if(e>0)num.push(qHTMLsym(v,e));else if(e<0)den.push(qHTMLsym(v,e));}
  const join=a=>a.join('<span class="dot">·</span>');
  let body=num.length?join(num):'<span class="n">1</span>';
  if(den.length)body=`<span class="frac"><span>${body}</span><span>${join(den)}</span></span>`;
  if(sol.root===2)body=`<span class="rt"><span class="rs">√</span><span class="rad">${body}</span></span>`;
  return body;
}
const eqHTML=(t,sol)=>`<span class="fx">${Q[t].s}<span class="eq">=</span>${solHTML(sol)}</span>`;

const dz=()=>[0,0,0,0,0];
const dadd=(a,b,k)=>a.map((x,i)=>x+(k===undefined?1:k)*b[i]);
const dscale=(a,k)=>a.map(x=>x*k);
const deq=(a,b)=>a.every((x,i)=>Math.abs(x-b[i])<1e-9);
function solDim(sol){let d=dz();for(const v in sol.inner)d=dadd(d,Q[v].d,sol.inner[v]);return dscale(d,1/sol.root);}
const NAMED=[['Н',D(1,1,-2)],['Дж',D(2,1,-2)],['Вт',D(2,1,-3)],['Па',D(-1,1,-2)],['В',D(2,1,-3,-1)],['Ом',D(2,1,-3,-2)],['Кл',D(0,0,1,1)],['Гц',D(0,0,-1)]];
const BASE=['м','кг','с','А','К'],ORDER=[1,0,2,3,4];
function expSup(e){if(e===1)return '';const t=Number.isInteger(e)?String(e):(e===.5?'1/2':e===1.5?'3/2':fmtX(e));return `<sup>${t}</sup>`;}
function unitHTML(d){
  if(d.every(x=>Math.abs(x)<1e-9))return 'безразмерное число';
  for(const [n,u] of NAMED)if(deq(d,u))return n;
  const num=[],den=[];
  for(const i of ORDER){const e=d[i];if(e>1e-9)num.push(BASE[i]+expSup(e));else if(e<-1e-9)den.push(BASE[i]+expSup(-e));}
  return (num.length?num.join('·'):'1')+(den.length?'/'+den.join('·'):'');
}

/* ===== Разбор формулы из блоков ===== */
function PErr(code){this.code=code;}
const PMSG={empty:'Собери формулу из блоков.',end:'Формула не дописана: после знака должна стоять величина или число.',paren:'Скобки не закрыты или стоят лишние.',unexpected:'Знаки стоят в неправильном порядке. Проверь, что между величинами нет двух знаков подряд.'};
function parse(toks){
  let i=0;const peek=()=>toks[i];
  function expr(){let a=term();while(peek()&&peek().k==='op'&&(peek().v==='+'||peek().v==='-')){const op=toks[i++].v;a={t:'bin',op,a,b:term()};}return a;}
  function term(){let a=unary();for(;;){const p=peek();if(!p)break;
    if(p.k==='op'&&(p.v==='*'||p.v==='/')){i++;a={t:'bin',op:p.v,a,b:unary()};}
    else if(p.k==='v'||p.k==='n'||p.k==='('||p.k==='rt'){a={t:'bin',op:'*',a,b:unary()};}
    else break;}return a;}
  function unary(){const p=peek();if(p&&p.k==='op'&&p.v==='-'){i++;return {t:'neg',a:unary()};}return power();}
  function power(){let a=primary();while(peek()&&peek().k==='sq'){i++;a={t:'sq',a};}return a;}
  function primary(){const p=toks[i++];if(!p)throw new PErr('end');
    if(p.k==='n')return {t:'num',v:p.v};
    if(p.k==='v')return {t:'var',id:p.id};
    if(p.k==='('){const e=expr();if(!peek()||peek().k!==')')throw new PErr('paren');i++;return e;}
    if(p.k==='rt')return {t:'sqrt',a:power()};
    throw new PErr(p.k===')'?'paren':'unexpected');}
  if(!toks.length)throw new PErr('empty');
  const e=expr();if(i<toks.length)throw new PErr(toks[i].k===')'?'paren':'unexpected');return e;
}
function evN(n,env){switch(n.t){
  case 'num':return n.v;case 'var':return env[n.id];case 'neg':return -evN(n.a,env);
  case 'sq':{const x=evN(n.a,env);return x*x;}case 'sqrt':return Math.sqrt(evN(n.a,env));
  case 'bin':{const a=evN(n.a,env),b=evN(n.b,env);return n.op==='+'?a+b:n.op==='-'?a-b:n.op==='*'?a*b:a/b;}}}
function evD(n){switch(n.t){
  case 'num':return dz();case 'var':return Q[n.id].d.slice();case 'neg':return evD(n.a);
  case 'sq':return dscale(evD(n.a),2);case 'sqrt':return dscale(evD(n.a),.5);
  case 'bin':{const a=evD(n.a),b=evD(n.b);
    if(n.op==='+'||n.op==='-'){if(!deq(a,b))throw {add:true,da:a,db:b};return a;}
    return n.op==='*'?dadd(a,b):dadd(a,b,-1);}}}
function collect(n,set){set=set||new Set();if(n.t==='var')set.add(n.id);if(n.a)collect(n.a,set);if(n.b)collect(n.b,set);return set;}

function tokenize(str){return str.trim().split(/\s+/).map(w=>{
  if(/^\d+(\.\d+)?$/.test(w))return {k:'n',v:+w};
  if(w.length===1&&'+-*/'.includes(w))return {k:'op',v:w};
  if(w==='('||w===')')return {k:w};

const CONV_VALS=[0.5,1.5,2,4,5,12,25,250,500];
function genConvert(){
  const [from,to,k,wrong,expl,vals]=pick(CONV);const x=pick(vals||CONV_VALS);
  const correct=fmtNum(x*k)+' '+to;const opts=[correct];
  for(const w of shuffle(wrong)){const o=fmtNum(x*w)+' '+to;if(!opts.includes(o))opts.push(o);}
  return {text:`Переведи в единицы СИ: <b class="big-n">${fmtNum(x)} ${from}</b> = ? ${to}`,opts:shuffle(opts.slice(0,4)),correct,
    expl:`<p>${expl}</p><p>${fmtNum(x)} ${from} = ${correct}</p>`};
}
function baseHTML(d){
  const num=[],den=[];
  for(const i of ORDER){const e=d[i];if(e>1e-9)num.push(BASE[i]+expSup(e));else if(e<-1e-9)den.push(BASE[i]+expSup(-e));}
  const n=num.length?num.join('·'):'1';
  return den.length?n+'/'+(den.length>1?'('+den.join('·')+')':den[0]):n;
}
const DERIVED=[
  ['Н','сила',D(1,1,-2),'F = m·a, значит 1 Н = 1 кг · 1 м/с².'],
  ['Дж','работа и энергия',D(2,1,-2),'A = F·s, значит 1 Дж = 1 Н·м = 1 кг·м²/с².'],
  ['Вт','мощность',D(2,1,-3),'N = A/t, значит 1 Вт = 1 Дж/с = 1 кг·м²/с³.'],
  ['Па','давление',D(-1,1,-2),'p = F/S, значит 1 Па = 1 Н/м² = 1 кг/(м·с²).'],
  ['Кл','заряд',D(0,0,1,1),'q = I·t, значит 1 Кл = 1 А·с.'],
  ['Гц','частота',D(0,0,-1),'ν = 1/T, значит 1 Гц = 1/с.'],
  ['В','напряжение',D(2,1,-3,-1),'P = U·I, значит 1 В = 1 Вт/А = 1 кг·м²/(А·с³).'],
  ['дптр','оптическая сила',D(-1),'D = 1/F, значит 1 дптр = 1/м.'],
  ['Ом','сопротивление',D(2,1,-3,-2),'R = U/I, значит 1 Ом = 1 В/А = 1 кг·м²/(А²·с³).']
];
function genBase(){
  const [u,what,d,expl]=pick(DERIVED);const correct=baseHTML(d);const opts=[correct];
  const muts=shuffle([[0,1],[0,-1],[2,1],[2,-1],[1,-1],[1,1]]);
  for(const [i,dd] of muts){if(opts.length>=4)break;const m=d.slice();m[i]+=dd;if(m.every(x=>x===0))continue;const o=baseHTML(m);if(!opts.includes(o))opts.push(o);}
  return {text:`Из каких основных единиц СИ состоит <b>1 ${u}</b> (${what})?`,opts:shuffle(opts),correct,noCap:true,expl:`<p>${expl}</p>`};
}
function genMeasure(){
  const pool=[...new Set(F.flatMap(fVars))].filter(id=>Q[id].u&&!Q[id].u.startsWith('≈'));
  const id=pick(pool);const correct=Q[id].u;const opts=[correct];
  for(const o of shuffle(pool.map(x=>Q[x].u))){if(opts.length>=4)break;if(!opts.includes(o))opts.push(o);}
  return {text:`В чём измеряется ${Q[id].n} ${sym(id)}?`,opts:shuffle(opts),correct,noCap:true,expl:`<p>${cap(Q[id].n)} ${sym(id)} измеряется в ${correct}.</p>`};
}
function genUnits(){
  const r=Math.random();const q=r<.55?genConvert():r<.8?genBase():genMeasure();
  q.noCap=true;q.f=null;q.fid='units';return q;
}

// Каждый вопрос «Физики вокруг» запоминается: верно отвеченный вернётся через 1, 2, 4, 7, 15 дней,
// ошибочный — в ближайшей тренировке. Сначала идут новые и те, что пора повторить.
function lifePool(){const p=LIFE.filter(x=>{const f=F.find(g=>g.id===x.f);return f&&S.topics.includes(f.topic);});return p.length?p:LIFE;}
function lifeRecord(id,ok){
  S.life=S.life||{};const p=Object.assign({lv:0,next:0,r:0,w:0},S.life[id]);
  if(ok){p.r++;p.lv=Math.min(5,p.lv+1);p.next=Date.now()+INTERVALS[p.lv]*864e5;}
  else{p.w++;p.lv=Math.max(0,p.lv-1);p.next=Date.now();}
  S.life[id]=p;save();
}
function lifeLeft(){const now=Date.now(),L=S.life||{};return lifePool().filter(x=>!L[x.id]||L[x.id].next<=now).length;}
function genLife(){
  sess.lifeUsed=sess.lifeUsed||[];
  const now=Date.now(),L=S.life||{};
  const left=lifePool().filter(x=>!sess.lifeUsed.includes(x.id)&&(!L[x.id]||L[x.id].next<=now));
  if(!left.length)return null;
  const score=x=>{const p=L[x.id];return (p?1:0)+Math.random();};
  const it=left.map(x=>[score(x),x]).sort((a,b)=>a[0]-b[0])[0][1];
  sess.lifeUsed.push(it.id);
  const f=F.find(g=>g.id===it.f);
  return {f,lifeId:it.id,text:it.q,opts:shuffle(it.a),correct:it.a[0],noCap:true,
    expl:`<p>${it.e}</p><p class="small">Это объясняет формула «${f.name}»:</p><p>${eqF(f,f.lhs)}</p>`};
}

  if(t.k==='v')return Q[t.id].s;
  if(t.k==='n')return `<span class="n">${t.v}</span>`;
  if(t.k==='op')return `<span class="op">${{'+':'+','-':'−','*':'·','/':'/'}[t.v]}</span>`;
  if(t.k==='sq')return '<sup>2</sup>';
  if(t.k==='rt')return '<span class="n">√</span>';
  return `<span class="n">${t.k}</span>`;
}
function whatifHTML(q){
  return `<p class="qtext">${q.text}</p>
  <div class="opts">${q.opts.map((o,i)=>{let cls='';if(sess.answered){if(o===q.correct)cls='right';else if(i===q.chosen)cls='wrong';}
    return `<button class="opt ${cls}" data-act="opt" data-i="${i}" ${sess.answered?'disabled':''}>${q.noCap?o:cap(o)}</button>`;}).join('')}</div>
  ${sess.answered?fbHTML(q.chosenOk?'ok':'bad',q.chosenOk?'Верно':'Не совсем',q.expl)+nextBtn():''}`;
}
const KEYS=[['op:*','·','умножить'],['op:/','/','разделить'],['op:+','+','плюс'],['op:-','−','минус'],['(:','(','открыть скобку'],['):',')','закрыть скобку'],['sq:','x²','в квадрат'],['rt:','√','корень'],['n:1','1','один'],['n:2','2','два'],['del:','⌫','стереть']];
function explainHTML(q){
  const f=q.f,t=q.t,fb=q.fb;let x='';
  if(fb.kind==='final')x+=`<h3>Где ошибка</h3><p>Ты записал: <span class="fx">${Q[t].s}<span class="eq">=</span>${fb.toks.map(tokHTML).join('')}</span></p>${fb.msg}`;
  x+=`<h3>Правильный ответ</h3><p>${eqF(f,t)}</p>`;
  if(t!==f.lhs)x+=`<p>Он получается из исходной формулы ${eqF(f,f.lhs)}: величину ${sym(t)} оставляют одну в левой части, а остальные переносят вправо.</p>`;
  x+=`<h3>Суть формулы</h3><p>${f.about}</p>`;
  x+=`<h3>Что можно найти</h3><p>${f.use}</p><ul class="forms">${varsOf(f).map(v=>`<li>${eqF(f,v)}<span>${nm(f,v)}</span></li>`).join('')}</ul>`;
  return fbHTML('final','Разберём вместе',x);
}
function buildHTML(q){
  const expr=q.toks.length?q.toks.map(tokHTML).join(''):'<span class="ph">собери из блоков ниже</span>';
  let out=`${buildHead(q)}
  <div class="sheet build"><span class="fx big">${Q[q.t].s}<span class="eq">=</span>${expr}</span></div>`;
  if(sess.answered){
    out+=q.fb.kind==='ok'
      ?(q.task?fbHTML('ok',q.wrongs?'Получилось':'Верно с первой попытки',taskOkHTML(q)):fbHTML('ok',q.wrongs?'Получилось':'Верно',`<p>Например, так: ${eqF(q.f,q.t)}</p><p>Засчитывается любая равносильная запись.</p>`))
      :(q.task?taskExplainHTML(q):explainHTML(q));
    return out+nextBtn();
  }
  if(q.fb&&q.fb.kind==='bad'){
    const lvl1=q.wrongs===1;
    return out+fbHTML('bad',lvl1?'Есть ошибка':'Подсказка',q.fb.msg+`<p class="small">${lvl1?'Попробуй ещё раз. Если снова не выйдет, подскажу подробнее.':'Если и сейчас не получится, покажу ответ с разбором.'}</p>`)
      +`<button class="btn wide next" data-act="fix">Исправить</button>
    ${q.reported?'':'<button class="link" data-act="report">Я считаю, что ответ верный</button>'}`;
  }
  if(q.fb&&q.fb.kind==='soft')out+=fbHTML('note','Подсказка',`<p>${q.fb.msg}</p>`);
  out+=`<p class="palabel">Величины</p><div class="pal">${q.palette.map(id=>`<button class="key v" data-act="tok" data-k="v:${id}" aria-label="${nm(q.f,id)}" title="${nm(q.f,id)}${Q[id].u?', '+Q[id].u:''}">${Q[id].s}</button>`).join('')}</div>
  <p class="palabel">Знаки и числа</p><div class="pal">
    ${KEYS.map(([k,l,a])=>`<button class="key o" data-act="${k==='del:'?'del':'tok'}" data-k="${k}" aria-label="${a}">${l}</button>`).join('')}
  </div>
  <div class="acts"><button class="btn primary" data-act="check" ${q.toks.length?'':'disabled'}>Проверить</button><button class="btn" data-act="reveal">Не знаю</button></div>
  ${q.wrongs?`<p class="hint">Попытка ${q.wrongs+1} из 3</p>`:''}`;
  return out;
}
function verdictHTML(q){
  let out=`<p class="qtext"><span class="fname">${q.f.name}.</span> Эта запись верна?</p>
  <div class="sheet"><span class="big">${q.shownHTML}</span></div>`;
  if(!sess.answered)return out+`<div class="two"><button class="btn" data-act="verdict" data-v="ok">Верна</button><button class="btn" data-act="verdict" data-v="bad">Есть ошибка</button></div>`;
  const title=q.chosenOk?(q.wrong?'Верно, здесь ошибка':'Верно, формула правильная'):(q.wrong?'Здесь есть ошибка':'Формула правильная');
  return out+fbHTML(q.chosenOk?'ok':'bad',title,q.expl)+nextBtn();
}
function qHTML(){
  const q=sess.q,pct=Math.round(sess.i/sess.n*100);
  const body=q.opts?whatifHTML(q):q.toks?buildHTML(q):verdictHTML(q);
  return `<div class="qtop"><button class="link" data-act="quit">Закончить</button><span class="count">Вопрос ${sess.i+1} из ${sess.n}</span></div>
  <div class="bar" aria-hidden="true"><span style="width:${pct}%"></span></div>
  ${q.boss?'':`<p class="modename">${MODEN[q.mode]}</p>`}${body}`;
}
function endHTML(){
  const wrong=sess.wrong.map(id=>F.find(f=>f.id===id));
  return `<header class="head"><span class="logo">FizHub</span></header>
  <p class="endscore">${sess.score} из ${sess.done}</p>
  <p class="lead" style="margin:0">${sess.done===0?'Ни одного ответа в этой тренировке.':sess.score===sess.done?'Все ответы верные с первой попытки.':'Верных ответов с первой попытки.'}</p>
  ${endExtraHTML()}
  ${wrong.length?`<h2>Эти формулы вернутся раньше</h2><ul class="endlist">${wrong.map(f=>`<li>${f.name}</li>`).join('')}</ul>`:''}
  <div class="stack"><button class="btn primary wide" data-act="again">${sess.mode==='boss'?'К задачам-боссам':'Ещё тренировка'}</button><button class="btn wide" data-act="home">На главную</button></div>`;
}
function refHTML(){
  const now=Date.now();
  const seg=`<div class="seg" role="tablist"><button role="tab" aria-selected="${refTab==='f'}" class="${refTab==='f'?'on':''}" data-act="reftab" data-id="f">Формулы</button><button role="tab" aria-selected="${refTab==='u'}" class="${refTab==='u'?'on':''}" data-act="reftab" data-id="u">Единицы</button><button role="tab" aria-selected="${refTab==='t'}" class="${refTab==='t'?'on':''}" data-act="reftab" data-id="t">Задачи</button></div>`;
  if(refTab==='t')return `<h1 class="title">Справочник</h1>${seg}<p class="lead">Разборы задач из режима «Ответ в общем виде», которые ты уже решил или разобрал.</p><div class="ref">${refTasksHTML()}</div>`;
  if(refTab==='u')return `<h1 class="title">Справочник</h1>${seg}<p class="lead">Приставки, переводы в СИ и из чего состоят единицы.</p><div class="ref">${refUnitsHTML()}</div>`;
  return `<h1 class="title">Справочник</h1>${seg}<p class="lead">Все формулы тренажёра с величинами и единицами.</p><div class="ref">
  ${TOPICS.map(t=>`<h2>${t.n}</h2>${F.filter(f=>f.topic===t.id).map(f=>{
    const p=prog(f.id),seen=!!S.prog[f.id];
    const st=!seen?['','Новая']:p.lv>=3?['learned','Выучена']:p.next<=now?['due','Пора повторить']:['','Учу'];
    const vars=fVars(f);
    return `<div class="fitem"><div class="fhead"><span class="fname">${f.name}</span><span class="fstate ${st[0]}">${st[1]}</span></div>
      ${eqF(f,f.lhs)}
      <p class="about">${f.about}</p>
      <ul class="legend">${vars.map(v=>`<li>${sym(v)} — ${nm(f,v)}${Q[v].u?', '+Q[v].u:''}</li>`).join('')}</ul></div>`;}).join('')}`).join('')}</div>`;
}
const I_TRAIN='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="13.5" r="8"/><circle cx="10.5" cy="13.5" r="4.5"/><circle cx="10.5" cy="13.5" r="1" fill="currentColor"/><path d="M10.5 13.5 19 5"/><path d="M19 5h3M19 5V2"/><path d="M17 7h2.5M17 7V4.5"/></svg>';
const I_BOOK='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>';
const navHTML=()=>`<nav class="nav"><button data-act="nav" data-v="home" class="${view==='home'||view==='bosses'?'on':''}">${I_TRAIN}<span>Тренировка</span></button><button data-act="nav" data-v="ref" class="${view==='ref'?'on':''}">${I_BOOK}<span>Справочник</span></button></nav>`;
function render(){
  let h='';
  if(view==='home')h=homeHTML()+navHTML();
  else if(view==='ref')h=refHTML()+navHTML();
  else if(view==='q')h=qHTML();
  else if(view==='end')h=endHTML();
  else if(view==='bosses')h=bossesHTML()+navHTML();
  const oldPop=root.querySelector?root.querySelector('.pop'):null,popTop=oldPop?oldPop.scrollTop:0;
  root.innerHTML=h;
  if(oldPop&&sheet){const np=root.querySelector('.pop');if(np)np.scrollTop=popTop;}
  if(inTG&&tgAtLeast('6.1')){if(view==='home'&&!sheet)tg.BackButton.hide();else tg.BackButton.show();}
}
if(inTG&&tgAtLeast('6.1'))tg.BackButton.onClick(()=>{
  if(sheet){sheet=null;render();return;}
  if(view==='q'){view=sess.done>0?'end':'home';}else view='home';
  render();window.scrollTo(0,0);
});
let toastT=null;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2600);}

/* ===== Действия ===== */
root.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,q=sess&&sess.q;
  switch(a){
    case 'start':if(b.dataset.mode==='life'&&!lifeLeft()){toast('По выбранным темам все вопросы пройдены. Они вернутся для повторения через 1–2 дня');break;}if(b.dataset.mode==='boss'){view='bosses';render();window.scrollTo(0,0);break;}startSession(b.dataset.mode);window.scrollTo(0,0);break;
    case 'topic':{const id=b.dataset.id;
      if(id==='all')S.topics=TOPICS.map(t=>t.id);
      else if(allTopics())S.topics=[id];
      else if(S.topics.includes(id)){if(S.topics.length===1){toast('Нужна хотя бы одна тема');return;}S.topics=S.topics.filter(x=>x!==id);}
      else S.topics=TOPICS.map(t=>t.id).filter(x=>x===id||S.topics.includes(x));
      save();render();break;}
    case 'mode':S.mode=b.dataset.id;save();sheet=null;render();break;
    case 'sheet':sheet=b.dataset.id;sheetAnim=true;render();sheetAnim=false;break;
    case 'close':sheet=null;render();break;
    case 'noop':break;
    case 'reset':if(!resetArm){resetArm=true;render();setTimeout(()=>{if(resetArm){resetArm=false;if(view==='home')render();}},4000);}
      else{S=fresh();save();resetArm=false;render();toast('Прогресс стёрт');}break;
    case 'boss':startSession('boss',b.dataset.id);window.scrollTo(0,0);break;
    case 'gogeneral':S.mode='general';save();view='home';render();window.scrollTo(0,0);break;
    case 'reftab':refTab=b.dataset.id;render();window.scrollTo(0,0);break;
    case 'nav':sheet=null;view=b.dataset.v;render();window.scrollTo(0,0);break;
    case 'quit':view=sess.done>0?'end':'home';render();window.scrollTo(0,0);break;
    case 'opt':{const i=+b.dataset.i;q.chosen=i;q.chosenOk=q.opts[i]===q.correct;sess.answered=true;finish(q.chosenOk);render();break;}
    case 'verdict':{q.chosenOk=(b.dataset.v==='bad')===q.wrong;sess.answered=true;finish(q.chosenOk);render();break;}
    case 'tok':{haptic('tap');const [kind,val]=b.dataset.k.split(':');let t;
      if(kind==='v')t={k:'v',id:val};else if(kind==='n')t={k:'n',v:+val};else if(kind==='op')t={k:'op',v:val};else t={k:kind};
      q.toks.push(t);if(q.fb&&q.fb.kind==='soft')q.fb=null;render();break;}
    case 'del':q.toks.pop();if(q.fb&&q.fb.kind==='soft')q.fb=null;render();break;
    case 'check':{const r=checkBuild(q);
      if(r.soft){q.fb={kind:'soft',msg:r.msg};}
      else if(r.ok){q.fb={kind:'ok'};taskDone(q);if(!q.counted){q.counted=true;finish(true);}sess.answered=true;}
      else{q.wrongs=(q.wrongs||0)+1;if(!q.counted){q.counted=true;finish(false);}
        if(q.wrongs>=3){taskSeen(q);q.fb={kind:'final',msg:r.msg,toks:q.toks.slice()};sess.answered=true;}
        else q.fb={kind:'bad',msg:q.wrongs===1?r.light:r.msg};}
      render();break;}
    case 'fix':q.fb=null;render();break;
    case 'reveal':if(!q.counted){q.counted=true;finish(false);}taskSeen(q);q.fb={kind:'reveal'};sess.answered=true;render();break;
    case 'report':S.reports.push({formula:q.fid||q.f.id,target:q.t,answer:q.toks.map(t=>t.k==='v'?t.id:t.k==='n'?t.v:t.v||t.k).join(' '),date:new Date().toISOString()});
      save();q.reported=true;render();toast('Сообщение сохранено на этом устройстве');break;
    case 'next':sess.i++;nextQ();window.scrollTo(0,0);break;
    case 'again':if(sess.mode==='life'&&!lifeLeft()){view='home';render();toast('По выбранным темам все вопросы пройдены. Выбери другие темы или режим');break;}if(sess.mode==='boss'){view='bosses';render();window.scrollTo(0,0);break;}startSession(sess.mode);window.scrollTo(0,0);break;
    case 'home':view='home';render();window.scrollTo(0,0);break;
  }
});
if(document.addEventListener)document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet){sheet=null;render();}});
render();
</script>
</body>
</html>
